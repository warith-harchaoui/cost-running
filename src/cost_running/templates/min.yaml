  name: "default"
  runtime_seconds:
    value: null
    unit: "s"
    status: "TODO"       # measure with `cost-running measure -- <command>`
  local_compute:
    energy_kwh:
      value: null
      status: "TODO"
    electricity_cost_usd:
      value: null
      status: "TODO"
    carbon_gco2e:
      value: null
      status: "TODO"
  external_api_cost_usd:
    value: 0.0
    unit: "USD"
    status: "placeholder"
  totals:
    total_cost_usd:
      value: null
      status: "TODO"
    total_carbon_gco2e:
      value: null
      status: "TODO"

exclusions:
  - "Embodied hardware carbon (manufacturing) is not counted by default."
  - "Storage and network egress are excluded unless materially relevant."
