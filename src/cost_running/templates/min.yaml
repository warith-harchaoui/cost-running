# Copy this file, then replace every TODO with a sourced or measured value.
# Run `cost-running validate <file>` and `cost-running render <file>` after
# each edit. Every number carries a status: measured / estimated / placeholder
# / TODO. Never present an estimate as measured.

schema_version: "1.0"

date_updated: "YYYY-MM-DD"

canonical_unit_of_work:
  name: "one run of the primary task"
  description: "Replace with the single most representative unit of work."
  status: "TODO"

